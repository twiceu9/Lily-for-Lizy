<!DOCTYPE html>
<html lang="en" data-mood="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lilium — Botanical Study</title>

  <!-- Tailwind CSS for responsive layout utilities -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Refined Serif & Clean Sans-Serif Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. THEME & LIGHTING MOOD VARIABLES
       ========================================================================== */
    :root {
      --bg-core: #0d201a;
      --bg-mid: #081310;
      --bg-edge: #030706;
      --glow-primary: rgba(186, 232, 206, 0.16);
      --glow-secondary: rgba(240, 212, 152, 0.09);
      --text-primary: rgba(244, 246, 242, 0.92);
      --text-muted: rgba(205, 219, 211, 0.52);
      --pill-bg: rgba(12, 24, 20, 0.56);
      --pill-border: rgba(220, 240, 230, 0.12);
      --pill-active-bg: rgba(235, 248, 240, 0.13);
      --pill-active-text: #f5faf7;
      --flower-filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.65)) brightness(1) contrast(1.02);
      --petal-tint: rgba(255, 255, 255, 0);
    }

    /* Mood: Dawn Mist */
    html[data-mood="dawn"] {
      --bg-core: #352b3b;
      --bg-mid: #201a26;
      --bg-edge: #110d15;
      --glow-primary: rgba(245, 202, 215, 0.2);
      --glow-secondary: rgba(215, 195, 240, 0.12);
      --text-primary: rgba(252, 244, 247, 0.94);
      --text-muted: rgba(230, 210, 222, 0.58);
      --pill-bg: rgba(34, 26, 40, 0.55);
      --pill-border: rgba(248, 224, 236, 0.15);
      --pill-active-bg: rgba(255, 232, 242, 0.16);
      --pill-active-text: #fff5f9;
      --flower-filter: drop-shadow(0 24px 48px rgba(14, 7, 20, 0.55)) sepia(0.06) hue-rotate(-14deg) saturate(1.06) brightness(1.03);
    }

    /* Mood: Golden Hour */
    html[data-mood="golden"] {
      --bg-core: #3c2918;
      --bg-mid: #21160d;
      --bg-edge: #100a05;
      --glow-primary: rgba(255, 203, 122, 0.24);
      --glow-secondary: rgba(235, 148, 72, 0.12);
      --text-primary: rgba(255, 246, 232, 0.94);
      --text-muted: rgba(236, 214, 184, 0.58);
      --pill-bg: rgba(36, 24, 14, 0.58);
      --pill-border: rgba(255, 224, 178, 0.16);
      --pill-active-bg: rgba(255, 224, 172, 0.18);
      --pill-active-text: #fff8eb;
      --flower-filter: drop-shadow(0 24px 48px rgba(18, 9, 2, 0.65)) sepia(0.18) saturate(1.16) brightness(1.04);
    }

    /* ==========================================================================
       2. BASE LAYOUT & ATMOSPHERE
       ========================================================================== */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-edge);
      color: var(--text-primary);
      user-select: none;
    }

    .font-serif-botanical {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* Atmospheric Radial Vignette Background */
    .atmosphere-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 45%, var(--bg-core) 0%, var(--bg-mid) 46%, var(--bg-edge) 100%);
      transition: background 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Subtle film grain overlay for organic fine-art print texture */
    .atmosphere-grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.035;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.8) 0.5px, transparent 0.5px);
      background-size: 24px 24px;
    }

    /* Soft Luminous Halo behind the Lily */
    .ambient-halo {
      position: fixed;
      top: 46%;
      left: 50%;
      width: min(76vw, 560px);
      height: min(76vw, 560px);
      transform: translate(-50%, -50%);
      border-radius: 9999px;
      background: radial-gradient(
        circle at center,
        var(--glow-primary) 0%,
        var(--glow-secondary) 42%,
        transparent 72%
      );
      filter: blur(28px);
      z-index: 2;
      pointer-events: none;
      transition: background 1.2s ease, opacity 0.8s ease;
      animation: haloBreath 7.5s ease-in-out infinite;
    }

    .ambient-halo.pulse-burst {
      animation: haloPulseOnce 1.1s cubic-bezier(0.22, 1, 0.36, 1), haloBreath 7.5s ease-in-out 1.1s infinite;
    }

    /* Canvas for drifting firefly & pollen motes */
    #pollenCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* ==========================================================================
       3. CENTERED LILY STAGE & 3D PARALLAX
       ========================================================================== */
    .lily-stage {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1100px;
      pointer-events: none;
    }

    .lily-parallax-wrap {
      position: relative;
      width: min(92vw, 540px);
      height: min(84dvh, 660px);
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      will-change: transform;
      pointer-events: auto;
      cursor: pointer;
    }

    /* Continuous gentle evening breeze sway */
    .lily-sway-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 92%;
      animation: gentleBreeze 8.5s ease-in-out infinite;
    }

    #lilySvg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: var(--flower-filter);
      transition: filter 1.2s ease;
    }

    /* ==========================================================================
       4. BOTANICAL BLOOMING & BREATHING ANIMATIONS
       ========================================================================== */
    /* Initial closed/bud state before .bloomed is applied */
    .stem-group {
      transform-origin: 300px 720px;
      transform: translateY(48px) scaleY(0.88);
      opacity: 0;
      transition: transform 1.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.3s ease;
    }

    .leaf-left {
      transform-origin: 298px 560px;
      transform: rotate(28deg) scale(0.45);
      opacity: 0;
      transition: transform 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.25s, opacity 1.2s ease 0.25s;
    }

    .leaf-right {
      transform-origin: 304px 510px;
      transform: rotate(-28deg) scale(0.45);
      opacity: 0;
      transition: transform 1.9s cubic-bezier(0.22, 1, 0.36, 1) 0.38s, opacity 1.2s ease 0.38s;
    }

    .leaf-lower {
      transform-origin: 300px 635px;
      transform: rotate(-22deg) scale(0.4);
      opacity: 0;
      transition: transform 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.45s, opacity 1.2s ease 0.45s;
    }

    /* Flower head rises slightly & opens */
    .flower-head {
      transform-origin: 300px 315px;
      transform: translateY(28px) scale(0.76);
      opacity: 0;
      transition: transform 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s, opacity 1.2s ease 0.15s;
    }

    /* Petals start folded inward like a lily bud */
    .petal {
      transform-origin: 300px 305px;
      opacity: 0.2;
      transition:
        transform 2.1s cubic-bezier(0.19, 1, 0.22, 1),
        opacity 1.3s ease;
    }

    .petal-outer-1 { transform: scale(0.35, 0.65) rotate(-22deg); transition-delay: 0.28s; }
    .petal-outer-2 { transform: scale(0.35, 0.65) rotate(22deg);  transition-delay: 0.36s; }
    .petal-outer-3 { transform: scale(0.35, 0.65) rotate(-18deg); transition-delay: 0.44s; }

    .petal-inner-1 { transform: scale(0.28, 0.58) rotate(18deg);  transition-delay: 0.56s; }
    .petal-inner-2 { transform: scale(0.28, 0.58) rotate(-20deg); transition-delay: 0.64s; }
    .petal-inner-3 { transform: scale(0.28, 0.58) rotate(16deg);  transition-delay: 0.72s; }

    /* Throat glow & stamens emerge last */
    .throat-glow {
      transform-origin: 300px 305px;
      transform: scale(0.2);
      opacity: 0;
      transition: transform 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.75s, opacity 1.5s ease 0.75s;
    }

    .stamens-group {
      transform-origin: 300px 305px;
      transform: scale(0.32) rotate(-10deg);
      opacity: 0;
      transition: transform 1.9s cubic-bezier(0.19, 1, 0.22, 1) 0.85s, opacity 1.3s ease 0.85s;
    }

    .pistil-group {
      transform-origin: 300px 305px;
      transform: scale(0.35);
      opacity: 0;
      transition: transform 1.8s cubic-bezier(0.19, 1, 0.22, 1) 0.95s, opacity 1.3s ease 0.95s;
    }

    /* BLOOMED STATE */
    .bloomed .stem-group {
      transform: translateY(0) scaleY(1);
      opacity: 1;
    }

    .bloomed .leaf-left,
    .bloomed .leaf-right,
    .bloomed .leaf-lower {
      transform: rotate(0deg) scale(1);
      opacity: 1;
    }

    .bloomed .flower-head {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .bloomed .petal {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }

    .bloomed .throat-glow {
      transform: scale(1);
      opacity: 1;
    }

    .bloomed .stamens-group {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }

    .bloomed .pistil-group {
      transform: scale(1);
      opacity: 1;
    }

    /* Continuous organic breathing on inner & outer petals once bloomed */
    .bloomed .petal-breathe-outer {
      transform-origin: 300px 305px;
      animation: petalBreatheOuter 6.8s ease-in-out 2.2s infinite;
    }

    .bloomed .petal-breathe-inner {
      transform-origin: 300px 305px;
      animation: petalBreatheInner 6.8s ease-in-out 2.6s infinite;
    }

    .bloomed .stamen-tremor {
      transform-origin: 300px 305px;
      animation: stamenTremor 5.4s ease-in-out 2.4s infinite;
    }

    /* Interactive Click/Tap Ripple on Petals */
    .petal-ripple {
      animation: ripplePetal 1.15s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }

    .stamen-ripple {
      animation: rippleStamen 1.2s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }

    @keyframes gentleBreeze {
      0%, 100% {
        transform: rotate(-1.1deg) translateY(0px);
      }
      50% {
        transform: rotate(1.35deg) translateY(-5px);
      }
    }

    @keyframes haloBreath {
      0%, 100% {
        transform: translate(-50%, -50%) scale(0.96);
        opacity: 0.85;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.06);
        opacity: 1;
      }
    }

    @keyframes haloPulseOnce {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.9;
      }
      35% {
        transform: translate(-50%, -50%) scale(1.22);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(0.98);
        opacity: 0.88;
      }
    }

    @keyframes petalBreatheOuter {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.022) rotate(0.6deg); }
    }

    @keyframes petalBreatheInner {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.028) rotate(-0.7deg); }
    }

    @keyframes stamenTremor {
      0%, 100% { transform: rotate(0deg) scale(1); }
      33% { transform: rotate(1.2deg) scale(1.015); }
      66% { transform: rotate(-1deg) scale(0.99); }
    }

    @keyframes ripplePetal {
      0% { transform: scale(1) rotate(0deg); }
      28% { transform: scale(1.065) rotate(1.8deg); }
      62% { transform: scale(0.985) rotate(-0.9deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes rippleStamen {
      0% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.08) rotate(-3deg); }
      55% { transform: scale(0.97) rotate(2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* ==========================================================================
       5. MINIMAL FROSTED GLASS UI
       ========================================================================== */
    .glass-pill {
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: background 0.8s ease, border-color 0.8s ease;
    }

    .mood-btn {
      color: var(--text-muted);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mood-btn:hover {
      color: var(--text-primary);
    }

    .mood-btn[aria-pressed="true"] {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .fade-in-slow {
      opacity: 0;
      transform: translateY(-6px);
      animation: uiReveal 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
    }

    .fade-in-bottom {
      opacity: 0;
      transform: translateY(12px);
      animation: uiRevealBottom 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.9s forwards;
    }

    @keyframes uiReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes uiRevealBottom {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hint-fade {
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .hint-hidden {
      opacity: 0 !important;
      transform: translateY(4px);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Atmospheric Background & Vignette -->
  <div class="atmosphere-bg" aria-hidden="true"></div>
  <div class="atmosphere-grain" aria-hidden="true"></div>
  <div id="ambientHalo" class="ambient-halo" aria-hidden="true"></div>

  <!-- Drifting Pollen & Firefly Light Motes Canvas -->
  <canvas id="pollenCanvas" aria-hidden="true"></canvas>

  <!-- Discreet Botanical Title (Top Center / Non-intrusive) -->
  <header class="fixed top-5 sm:top-8 inset-x-0 z-10 flex flex-col items-center pointer-events-none px-4 fade-in-slow">
    <h1 class="font-serif-botanical text-2xl sm:text-3xl md:text-[2.15rem] font-light tracking-[0.22em] uppercase"
        style="color: var(--text-primary); transition: color 0.8s ease;">
      Lilium
    </h1>
    <p class="mt-1 text-[10px] sm:text-[11px] tracking-[0.32em] uppercase font-light"
       style="color: var(--text-muted); transition: color 0.8s ease;">
      Liliaceae &middot; Pure Elegance
    </p>
  </header>

  <!-- Main Centered Lily Stage -->
  <main class="lily-stage">
    <div id="lilyParallax" class="lily-parallax-wrap" role="button" tabindex="0"
         aria-label="Interactive Lilium flower. Click or tap to gently ripple petals and release golden pollen.">
      <div class="lily-sway-wrap">

        <!-- ====================================================================
             METICULOUSLY LAYERED BOTANICAL SVG LILY
             ViewBox: 600 x 720 | Blossom Center: (300, 305)
             ==================================================================== -->
        <svg id="lilySvg" viewBox="0 0 600 720" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Soft Petal Drop Shadow for 3D Overlap Depth -->
            <filter id="petalShadow" x="-18%" y="-18%" width="136%" height="136%">
              <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#05100c" flood-opacity="0.34" />
            </filter>

            <filter id="softGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="14" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <filter id="antherGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5c2008" flood-opacity="0.45" />
            </filter>

            <!-- Stem & Leaf Gradients (Fading softly into lower frame) -->
            <linearGradient id="stemGrad" x1="300" y1="330" x2="300" y2="715" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#3a5e44" />
              <stop offset="28%" stop-color="#274731" />
              <stop offset="68%" stop-color="#173020" />
              <stop offset="90%" stop-color="#0d1f14" stop-opacity="0.65" />
              <stop offset="100%" stop-color="#07120c" stop-opacity="0" />
            </linearGradient>

            <linearGradient id="stemHighlight" x1="295" y1="340" x2="306" y2="690" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#87b385" stop-opacity="0.55" />
              <stop offset="55%" stop-color="#4e7853" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#1a3322" stop-opacity="0" />
            </linearGradient>

            <linearGradient id="leafGradLeft" x1="300" y1="555" x2="150" y2="480" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1d3b27" />
              <stop offset="45%" stop-color="#2e573b" />
              <stop offset="85%" stop-color="#3f6e49" />
              <stop offset="100%" stop-color="#538258" stop-opacity="0.85" />
            </linearGradient>

            <linearGradient id="leafGradRight" x1="302" y1="505" x2="458" y2="435" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1a3523" />
              <stop offset="48%" stop-color="#2c5337" />
              <stop offset="86%" stop-color="#41704b" />
              <stop offset="100%" stop-color="#5a8a5e" stop-opacity="0.88" />
            </linearGradient>

            <linearGradient id="leafGradLower" x1="300" y1="635" x2="415" y2="600" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#142b1c" stop-opacity="0.7" />
              <stop offset="65%" stop-color="#24472f" stop-opacity="0.6" />
              <stop offset="100%" stop-color="#325e3d" stop-opacity="0.15" />
            </linearGradient>

            <!-- Outer Sepal Petal Gradient (Slightly cooler ivory-pearl shadow for depth) -->
            <radialGradient id="outerPetalGrad" cx="50%" cy="88%" r="92%" fx="50%" fy="92%">
              <stop offset="0%" stop-color="#c9de96" />
              <stop offset="14%" stop-color="#e5edd1" />
              <stop offset="30%" stop-color="#f7e9ec" />
              <stop offset="56%" stop-color="#f5f3f0" />
              <stop offset="84%" stop-color="#e8ece9" />
              <stop offset="100%" stop-color="#d5ddd9" />
            </radialGradient>

            <!-- Inner Petal Gradient (Luminous silk white with warm blush throat) -->
            <radialGradient id="innerPetalGrad" cx="50%" cy="90%" r="94%" fx="50%" fy="94%">
              <stop offset="0%" stop-color="#d6ea9b" />
              <stop offset="13%" stop-color="#f1f5d7" />
              <stop offset="28%" stop-color="#fae6ea" />
              <stop offset="52%" stop-color="#ffffff" />
              <stop offset="85%" stop-color="#f7f7f5" />
              <stop offset="100%" stop-color="#e9eeec" />
            </radialGradient>

            <!-- Subtle Central Midrib Highlight for Petals -->
            <linearGradient id="petalMidrib" x1="300" y1="305" x2="300" y2="90" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#b8d977" stop-opacity="0.85" />
              <stop offset="26%" stop-color="#f0c8d0" stop-opacity="0.4" />
              <stop offset="72%" stop-color="#ffffff" stop-opacity="0.65" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
            </linearGradient>

            <!-- Luminous Throat Nectary Glow -->
            <radialGradient id="throatRadial" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff8c9" stop-opacity="0.95" />
              <stop offset="32%" stop-color="#d7f099" stop-opacity="0.72" />
              <stop offset="68%" stop-color="#a8cf7a" stop-opacity="0.22" />
              <stop offset="100%" stop-color="#a8cf7a" stop-opacity="0" />
            </radialGradient>

            <!-- Filament Gradient (Pale green base transitioning to ivory) -->
            <linearGradient id="filamentGrad" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#a8cc78" />
              <stop offset="55%" stop-color="#e9f2d5" />
              <stop offset="100%" stop-color="#fff6e0" />
            </linearGradient>

            <!-- Warm Rusty-Orange / Amber Pollen-Dusted Anther Gradient -->
            <linearGradient id="antherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f7b24c" />
              <stop offset="38%" stop-color="#d96b27" />
              <stop offset="78%" stop-color="#9e3a14" />
              <stop offset="100%" stop-color="#692008" />
            </linearGradient>

            <!-- Pistil & Stigma Gradients -->
            <linearGradient id="pistilGrad" x1="300" y1="305" x2="310" y2="205" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#99c46c" />
              <stop offset="65%" stop-color="#d7eba8" />
              <stop offset="100%" stop-color="#f4f8d8" />
            </linearGradient>

            <radialGradient id="stigmaGrad" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#fffce0" />
              <stop offset="55%" stop-color="#cfe391" />
              <stop offset="100%" stop-color="#87ad58" />
            </radialGradient>

            <!-- Reusable Botanical Petal Art (Outer Sepal) -->
            <g id="outerPetalShape">
              <!-- Reflexed, sculpted outer sepal path -->
              <path d="M 300 308
                       C 282 265, 250 205, 256 146
                       C 261 102, 286 72, 300 54
                       C 314 72, 339 102, 344 146
                       C 350 205, 318 265, 300 308 Z"
                    fill="url(#outerPetalGrad)"
                    stroke="rgba(255,255,255,0.45)"
                    stroke-width="0.7" />
              <!-- Subtle reflexed tip shading -->

  <script>
    /**
     * Lilium Botanical Art Interactive Engine
     * Handles:
     * 1. Initial & Replayable Bloom Choreography
     * 2. Lighting Mood Palette Switching
     * 3. Smooth Mouse / Touch 3D Parallax Tilt
     * 4. Interactive Petal Ripple & Golden Pollen Burst on Click/Tap
     * 5. HTML5 Canvas Ambient Firefly & Pollen Mote Particle System
     */
    (function () {
      'use strict';

      /* ======================================================================
         DOM REFERENCES & STATE
         ====================================================================== */
      const rootHtml = document.documentElement;
      const lilySvg = document.getElementById('lilySvg');
      const lilyParallax = document.getElementById('lilyParallax');
      const ambientHalo = document.getElementById('ambientHalo');
      const replayBloomBtn = document.getElementById('replayBloomBtn');
      const moodButtons = document.querySelectorAll('[data-set-mood]');
      const interactionHint = document.getElementById('interactionHint');
      const canvas = document.getElementById('pollenCanvas');
      const ctx = canvas.getContext('2d');

      let currentMood = 'midnight';
      let hintDismissed = false;

      // Particle color palettes per lighting mood
      const MOOD_PARTICLE_COLORS = {
        midnight: [
          'rgba(246, 232, 178, ', // warm pale gold
          'rgba(195, 240, 214, ', // luminous mist mint
          'rgba(255, 248, 224, '  // soft ivory
        ],
        dawn: [
          'rgba(255, 216, 228, ', // blush rose
          'rgba(248, 230, 198, ', // warm pearl
          'rgba(232, 214, 252, '  // soft lavender
        ],
        golden: [
          'rgba(255, 214, 122, ', // honey gold
          'rgba(255, 186, 102, ', // warm amber
          'rgba(255, 242, 206, '  // sunlit cream
        ]
      };

      /* ======================================================================
         1. BLOOM CHOREOGRAPHY
         ====================================================================== */
      function triggerBloom() {
        lilySvg.classList.remove('bloomed');
        // Force synchronous reflow so CSS transitions restart cleanly
        void lilySvg.getBoundingClientRect();

        requestAnimationFrame(() => {
          setTimeout(() => {
            lilySvg.classList.add('bloomed');
          }, 90);
        });
      }

      replayBloomBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerBloom();
      });

      /* ======================================================================
         2. LIGHTING MOOD SWITCHING
         ====================================================================== */
      function setMood(mood) {
        if (!MOOD_PARTICLE_COLORS[mood]) return;
        currentMood = mood;
        rootHtml.setAttribute('data-mood', mood);

        moodButtons.forEach((btn) => {
          const isMatch = btn.getAttribute('data-set-mood') === mood;
          btn.setAttribute('aria-pressed', isMatch ? 'true' : 'false');
        });

        // Gently update ambient particle hues to match new mood
        ambientMotes.forEach((mote) => {
          mote.colorPrefix = pickRandomColor(currentMood);
        });
      }

      moodButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          setMood(btn.getAttribute('data-set-mood'));
        });
      });

      /* ======================================================================
         3. SMOOTH MOUSE & TOUCH 3D PARALLAX TILT
         ====================================================================== */
      const parallax = {
        targetX: 0,
        targetY: 0,
        currentX: 0,
        currentY: 0
      };

      function updateParallaxTarget(clientX, clientY) {
        const w = window.innerWidth || 1;
        const h = window.innerHeight || 1;
        // Normalized -1 to +1
        const nx = (clientX / w - 0.5) * 2;
        const ny = (clientY / h - 0.5) * 2;

        parallax.targetX = nx;
        parallax.targetY = ny;
      }

      window.addEventListener('mousemove', (e) => {
        updateParallaxTarget(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('mouseleave', () => {
        parallax.targetX = 0;
        parallax.targetY = 0;
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 0) {
          updateParallaxTarget(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        parallax.targetX = 0;
        parallax.targetY = 0;
      }, { passive: true });

      /* ======================================================================
         4. INTERACTIVE PETAL RIPPLE & POLLEN BURST
         ====================================================================== */
      function dismissHint() {
        if (!hintDismissed && interactionHint) {
          hintDismissed = true;
          interactionHint.classList.add('hint-hidden');
        }
      }

      // Auto-fade hint gently after 7.5 seconds
      setTimeout(dismissHint, 7500);

      function getBlossomScreenCenter() {
        const rect = lilySvg.getBoundingClientRect();
        // Blossom throat is at (300, 305) inside 600x720 viewBox
        return {
          x: rect.left + rect.width * (300 / 600),
          y: rect.top + rect.height * (305 / 720)
        };
      }

      function triggerFlowerInteraction(originX, originY) {
        dismissHint();

        // 1. Staggered soft ripple across all 6 petals
        const petals = lilySvg.querySelectorAll('.petal');
        petals.forEach((petal, idx) => {
          petal.classList.remove('petal-ripple');
          void petal.getBoundingClientRect();
          setTimeout(() => {
            petal.classList.add('petal-ripple');
          }, idx * 55);
          setTimeout(() => {
            petal.classList.remove('petal-ripple');
          }, 1250 + idx * 55);
        });

        // 2. Subtle stamen tremor ripple
        const stamens = lilySvg.querySelector('.stamen-tremor');
        if (stamens) {
          stamens.classList.remove('stamen-ripple');
          void stamens.getBoundingClientRect();
          stamens.classList.add('stamen-ripple');
          setTimeout(() => stamens.classList.remove('stamen-ripple'), 1250);
        }

        // 3. Soft halo glow pulse
        ambientHalo.classList.remove('pulse-burst');
        void ambientHalo.offsetWidth;
        ambientHalo.classList.add('pulse-burst');

        // 4. Emit delicate burst of golden pollen from the flower throat/anthers
        const center = getBlossomScreenCenter();
        const emitX = originX !== undefined ? (center.x * 0.72 + originX * 0.28) : center.x;
        const emitY = originY !== undefined ? (center.y * 0.72 + originY * 0.28) : center.y;
        spawnPollenBurst(emitX, emitY, 34);
      }

      lilyParallax.addEventListener('click', (e) => {
        triggerFlowerInteraction(e.clientX, e.clientY);
      });

      lilyParallax.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          triggerFlowerInteraction();
        }
      });

      /* ======================================================================
         5. HTML5 CANVAS AMBIENT & INTERACTIVE POLLEN PARTICLE ENGINE
         ====================================================================== */
      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const ambientMotes = [];
      const burstPollen = [];

      function pickRandomColor(mood) {
        const list = MOOD_PARTICLE_COLORS[mood] || MOOD_PARTICLE_COLORS.midnight;
        return list[Math.floor(Math.random() * list.length)];
      }

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function createAmbientMote(randomY = true) {
        return {
          x: Math.random() * width,
          y: randomY ? Math.random() * height : height + 16,
          radius: 0.9 + Math.random() * 2.2,
          vx: (Math.random() - 0.5) * 0.22,
          vy: -(0.12 + Math.random() * 0.34),
          phase: Math.random() * Math.PI * 2,
          phaseSpeed: 0.008 + Math.random() * 0.016,
          baseAlpha: 0.16 + Math.random() * 0.45,
          colorPrefix: pickRandomColor(currentMood)
        };
      }

      function initAmbientMotes() {
        ambientMotes.length = 0;
        const count = Math.min(Math.max(Math.floor((width * height) / 24000), 26), 62);
        for (let i = 0; i < count; i++) {
          ambientMotes.push(createAmbientMote(true));
        }
      }

      function spawnPollenBurst(x, y, count) {
        const burstColors = [
          'rgba(255, 224, 130, ', // golden pollen
          'rgba(255, 192, 96, ',  // warm amber
          'rgba(255, 246, 204, '  // luminous pale gold
        ];

        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.65 + Math.random() * 2.4;
          const spreadR = Math.random() * 28;
          burstPollen.push({
            x: x + Math.cos(angle) * spreadR,
            y: y + Math.sin(angle) * spreadR,
            vx: Math.cos(angle) * speed * 0.85,
            vy: Math.sin(angle) * speed * 0.75 - (0.45 + Math.random() * 0.9),
            radius: 1.1 + Math.random() * 2.3,
            life: 1.0,
            decay: 0.0065 + Math.random() * 0.009,
            wobblePhase: Math.random() * Math.PI * 2,
            colorPrefix: burstColors[Math.floor(Math.random() * burstColors.length)]
          });
        }
      }

      function drawGlowingMote(x, y, radius, colorPrefix, alpha) {
        if (alpha <= 0.005) return;
        const glowRadius = radius * 4.2;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
        grad.addColorStop(0, colorPrefix + Math.min(alpha * 1.15, 1).toFixed(3) + ')');
        grad.addColorStop(0.35, colorPrefix + (alpha * 0.45).toFixed(3) + ')');
        grad.addColorStop(1, colorPrefix + '0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      /* ======================================================================
         MAIN ANIMATION LOOP (PARALLAX + PARTICLES)
         ====================================================================== */
      function animate(time) {
        // Smooth parallax interpolation
        parallax.currentX += (parallax.targetX - parallax.currentX) * 0.055;
        parallax.currentY += (parallax.targetY - parallax.currentY) * 0.055;

        const rotY = parallax.currentX * 8.5;
        const rotX = -parallax.currentY * 6.5;
        const shiftX = parallax.currentX * 10;
        const shiftY = parallax.currentY * 8;

        lilyParallax.style.transform =
          `translate3d(${shiftX.toFixed(2)}px, ${shiftY.toFixed(2)}px, 0) rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;

        // Clear canvas
        ctx.clearRect(0, 0, width, height);

        const breezeWave = Math.sin(time * 0.00055) * 0.18;

        // Update & render ambient floating firefly/pollen motes
        for (let i = 0; i < ambientMotes.length; i++) {
          const m = ambientMotes[i];
          m.phase += m.phaseSpeed;
          m.x += m.vx + Math.sin(m.phase) * 0.22 + breezeWave;
          m.y += m.vy;

          // Wrap around softly
          if (m.y < -20) {
            m.y = height + 18;
            m.x = Math.random() * width;
          }
          if (m.x < -20) m.x = width + 18;
          if (m.x > width + 20) m.x = -18;

          const twinkle = 0.55 + 0.45 * Math.sin(m.phase * 1.4);
          drawGlowingMote(m.x, m.y, m.radius, m.colorPrefix, m.baseAlpha * twinkle);
        }

        // Update & render interactive pollen burst particles
        for (let i = burstPollen.length - 1; i >= 0; i--) {
          const p = burstPollen[i];
          p.wobblePhase += 0.06;
          p.vx *= 0.982;
          p.vy = p.vy * 0.982 - 0.012; // Gentle upward buoyancy
          p.x += p.vx + Math.sin(p.wobblePhase) * 0.35 + breezeWave * 1.4;
          p.y += p.vy;
          p.life -= p.decay;

          if (p.life <= 0) {
            burstPollen.splice(i, 1);
            continue;
          }

          const smoothAlpha = Math.sin(p.life * Math.PI * 0.5) * 0.88;
          drawGlowingMote(p.x, p.y, p.radius * (0.65 + p.life * 0.45), p.colorPrefix, smoothAlpha);
        }

        requestAnimationFrame(animate);
      }

      /* ======================================================================
         INITIALIZATION
         ====================================================================== */
      window.addEventListener('resize', () => {
        resizeCanvas();
        initAmbientMotes();
      });

      window.addEventListener('load', () => {
        resizeCanvas();
        initAmbientMotes();
        triggerBloom();
        requestAnimationFrame(animate);
      });
    })();
  </script>
</body>
</html>
